<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  /* Fixed-size box: headless Chrome screenshots the content box, not the window. */
  .stage {
    width: 1024px; height: 1024px;
    display: flex; align-items: center; justify-content: center;
  }
  /* 8% breathing room so the seal edge never touches the frame */
  .stage img { width: 84%; height: 84%; }
</style>
</head>
<body>
  <div class="stage">
    <img src="dede.svg" alt="Dede, mascot of Kisi">
  </div>
</body>
</html>
