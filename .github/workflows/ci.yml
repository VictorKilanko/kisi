name: CI

# Vercel builds and deploys on push via its Git integration, but it does NOT
# run lint, typecheck or tests. This workflow is the quality gate for the whole
# monorepo (canon, brand, and the three apps) via turbo.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      # Catches build-time failures (content integrity assertions, bad imports)
      # across all three apps before Vercel deploys them.
      - name: Build
        run: pnpm run build
